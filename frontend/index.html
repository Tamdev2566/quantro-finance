<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231976d2'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Finance & Double-Entry Accounting</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader" style="
        position: fixed;
        inset: 0;
        background-color: #0c0d14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      ">
        <style>
          @keyframes quantroSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes quantroPulse {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
          }
          @keyframes quantroBar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
          }
        </style>
        <div style="
          width: 56px;
          height: 56px;
          border-radius: 12px;
          background: linear-gradient(135deg, #f3c64f 0%, #d49b28 50%, #b88019 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 10px 25px rgba(229, 169, 60, 0.35);
          margin-bottom: 20px;
          animation: quantroPulse 2s ease-in-out infinite;
        ">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <path d="M4 6C4 4.89543 4.89543 4 6 4H8C9.10457 4 10 4.89543 10 6V18C10 19.1046 9.10457 20 8 20H6C4.89543 20 4 19.1046 4 18V6Z" fill="#12131c" />
            <path d="M11 9C11 7.89543 11.8954 7 13 7H15C16.1046 7 17 7.89543 17 9V18C17 19.1046 16.1046 20 15 20H13C11.8954 20 11 19.1046 11 18V9Z" fill="#12131c" fill-opacity="0.8" />
            <path d="M18 12C18 10.8954 18.8954 10 20 10H22V18C22 19.1046 21.1046 20 20 20H18V12Z" fill="#12131c" fill-opacity="0.6" />
          </svg>
        </div>
        <div style="
          color: #ffffff;
          font-size: 1.25rem;
          font-weight: 800;
          letter-spacing: -0.02em;
          margin-bottom: 8px;
        ">
          Quantro Finance
        </div>
        <div style="
          color: #94a3b8;
          font-size: 0.8rem;
          font-weight: 500;
          margin-bottom: 24px;
        ">
          Double-Entry Accounting & Ledger Engine
        </div>
        <div style="
          width: 140px;
          height: 3px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 99px;
          overflow: hidden;
          position: relative;
        ">
          <div style="
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, transparent, #e5a93c, transparent);
            border-radius: 99px;
            animation: quantroBar 1.2s infinite ease-in-out;
          "></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
